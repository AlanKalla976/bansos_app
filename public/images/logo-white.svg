<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="rgba(255,255,255,0.15)"/>
  <circle cx="40" cy="40" r="34" fill="rgba(255,255,255,0.1)"/>

  <!-- House shape -->
  <polygon points="40,10 58,26 58,50 22,50 22,26" fill="rgba(255,255,255,0.85)"/>
  <rect x="33" y="35" width="14" height="15" rx="2" fill="rgba(30,58,95,0.6)"/>
  <polygon points="40,8 61,26 19,26" fill="#F9C74F"/>

  <!-- People silhouettes -->
  <circle cx="28" cy="56" r="4.5" fill="#F9C74F"/>
